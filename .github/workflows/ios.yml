name: Native iOS
on:
  pull_request:
    paths: ['apps/ios/**', 'apps/client/scripts/native-*.ts', 'server/internal/api/native_interop_test.go', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.head_ref || github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Choose an installed iPhone Simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" "$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_OUTPUT" <<'PYDEVICE'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-' + sys.argv[2].replace('.', '-')
          phones = [d for d in devices.get(runtime, []) if 'iPhone' in d['name'] and d.get('isAvailable')]
          if not phones: raise SystemExit('No iPhone Simulator runtime matching selected Xcode SDK: ' + runtime)
          print('id=' + phones[0]['udid'])
          print('boot=' + str(phones[0].get('state') != 'Booted').lower())
          print('Selected ' + phones[0]['name'] + ' / ' + runtime, file=sys.stderr)
          PYDEVICE
      - name: Start Simulator while dependencies and app build run
        if: steps.simulator.outputs.boot == 'true'
        run: xcrun simctl boot '${{ steps.simulator.outputs.id }}'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native core tests and Swift-generated ciphertext
        run: swift test --package-path apps/ios/ChapterCore
        env:
          CHAPTER_NATIVE_OUTPUT: ${{ runner.temp }}/chapter-native-output.json
      - name: Verify Swift ciphertext with actual web decoder
        run: pnpm --filter client exec tsx scripts/native-vectors.ts
        env:
          CHAPTER_NATIVE_OUTPUT: ${{ runner.temp }}/chapter-native-output.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify Apple signatures with actual Go relay verifier
        working-directory: server
        run: go test ./internal/api -run TestNativeAppleAuthenticationInterop -v
        env:
          CHAPTER_NATIVE_OUTPUT: ${{ runner.temp }}/chapter-native-output.json
      - name: Build genuine native app for iOS Simulator (no signing credentials)
        id: simulator_build
        run: xcodebuild -project apps/ios/Chapter.xcodeproj -scheme Chapter -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ChapterBuild" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned Simulator app (not an iPhone IPA)
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ChapterBuild/Build/Products/Debug-iphonesimulator/Chapter.app" "$RUNNER_TEMP/Chapter-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Chapter-unsigned-Simulator
          path: ${{ runner.temp }}/Chapter-Simulator.zip
          retention-days: 7
      - name: Capture actual implemented native pages (public fixture, no mocks)
        run: |
          device='${{ steps.simulator.outputs.id }}'
          xcrun simctl ui "$device" content_size large
          xcodebuild -project apps/ios/Chapter.xcodeproj -scheme Chapter -configuration Debug -destination "platform=iOS Simulator,id=$device" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 -derivedDataPath "$RUNNER_TEMP/ChapterUITestBuild" -resultBundlePath "$RUNNER_TEMP/ChapterPages.xcresult" -only-testing:ChapterUITests/ChapterPageCaptures CODE_SIGNING_ALLOWED=NO test
      - name: Export real page screenshots before independent strict audit runs
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/ChapterPages.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ChapterPages.xcresult" --output-path "$RUNNER_TEMP/ChapterPageAttachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chapter-actual-page-screenshots
          path: |
            ${{ runner.temp }}/ChapterPages.xcresult
            ${{ runner.temp }}/ChapterPageAttachments
          retention-days: 7
      - name: Native UI smoke tests and accessibility audits
        if: always() && steps.simulator_build.outcome == 'success' && !cancelled()
        run: |
          # Use the actual OS preference: a launch-argument override can lock the
          # category while the dynamicType audit tries to change it. No findings
          # or audit categories are excluded in either run.
          device='${{ steps.simulator.outputs.id }}'
          trap 'xcrun simctl ui "$device" content_size large' EXIT
          xcrun simctl ui "$device" content_size large
          status=0
          xcodebuild -project apps/ios/Chapter.xcodeproj -scheme Chapter -configuration Debug -destination "platform=iOS Simulator,id=$device" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 -derivedDataPath "$RUNNER_TEMP/ChapterUITestBuild" -resultBundlePath "$RUNNER_TEMP/ChapterUITests.xcresult" -skip-testing:ChapterUITests/ChapterPageCaptures -skip-testing:ChapterUITests/ChapterUITests/testLargestDynamicTypeConnectionScreen -skip-testing:ChapterUITests/ChapterUITests/testLargestDynamicTypeControlGeometry -skip-testing:ChapterUITests/ChapterUITests/testLargestDynamicTypeUnmodifiedNativeFormReproduction CODE_SIGNING_ALLOWED=NO test || status=$?
          xcrun simctl ui "$device" content_size accessibility-extra-extra-extra-large
          xcodebuild -project apps/ios/Chapter.xcodeproj -scheme Chapter -configuration Debug -destination "platform=iOS Simulator,id=$device" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 -derivedDataPath "$RUNNER_TEMP/ChapterUITestBuild" -resultBundlePath "$RUNNER_TEMP/ChapterLargeTypeUITests.xcresult" -only-testing:ChapterUITests/ChapterUITests/testLargestDynamicTypeConnectionScreen -only-testing:ChapterUITests/ChapterUITests/testLargestDynamicTypeControlGeometry -only-testing:ChapterUITests/ChapterUITests/testLargestDynamicTypeUnmodifiedNativeFormReproduction CODE_SIGNING_ALLOWED=NO test-without-building || status=$?
          exit "$status"
      - name: Export genuine test screenshots for review
        if: always()
        run: |
          for kind in Chapter ChapterLargeType; do
            if [[ -d "$RUNNER_TEMP/${kind}UITests.xcresult" ]]; then
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/${kind}UITests.xcresult" --output-path "$RUNNER_TEMP/${kind}UIAttachments"
            fi
          done
      - name: Save real UI test results and fixture-only screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-native-ui-results
          path: |
            ${{ runner.temp }}/ChapterUITests.xcresult
            ${{ runner.temp }}/ChapterUIAttachments
            ${{ runner.temp }}/ChapterLargeTypeUITests.xcresult
            ${{ runner.temp }}/ChapterLargeTypeUIAttachments
          retention-days: 7
